version: '3.8'
services:
  database:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - db_data:/var/lib/postgresql/data
  backend:
    image: ${BACKEND_IMAGE}:latest
    container_name: spring_boot_app
    ports:
      - "5000:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env
    networks:
      - app_network
  frontend:
    image: ${FRONTEND_IMAGE}:latest
    container_name: react_app
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network
networks:
  app_network:
volumes:
  db_data: